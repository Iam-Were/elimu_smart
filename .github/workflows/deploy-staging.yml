name: Deploy to Staging

on:
  push:
    branches:
      - main  # Auto-deploy when you push to main
  workflow_dispatch:  # Manual trigger button in GitHub

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger VPS Staging Deployment
        run: |
          RESPONSE=$(curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -w "\n%{http_code}" \
            https://elimu-smart.co.ke/webhooks/deploy/staging)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Deployment trigger failed: HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          echo "✅ Deployment triggered successfully"
          echo "$BODY"

      - name: Wait for Deployment
        run: sleep 45

      - name: Verify Staging Deployment
        run: |
          STAGING_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.elimu-smart.co.ke/parse/health)
          if [ "$STAGING_STATUS" != "200" ]; then
            echo "❌ Staging health check failed: $STAGING_STATUS"
            exit 1
          fi
          echo "✅ Staging deployment verified: $STAGING_STATUS"

name: Deploy to Production

on:
  workflow_dispatch:  # Manual only - safety for production

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger VPS Production Deployment
        run: |
          RESPONSE=$(curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -w "\n%{http_code}" \
            https://elimu-smart.co.ke/webhooks/deploy/production)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Deployment trigger failed: HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          echo "✅ Deployment triggered successfully"
          echo "$BODY"

      - name: Wait for Deployment
        run: sleep 60

      - name: Verify Production Deployment
        run: |
          PROD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://elimu-smart.co.ke/parse/health)
          if [ "$PROD_STATUS" != "200" ]; then
            echo "❌ Production health check failed: $PROD_STATUS"
            exit 1
          fi
          echo "✅ Production deployment verified: $PROD_STATUS"

name: Deploy to Production

on:
  workflow_dispatch:  # Manual trigger for safety
  push:
    branches:
      - main  # Auto-deploy on main branch
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy-production.yml'
  workflow_call:  # Allow calling from other workflows

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Store deployment timestamp
        id: timestamp
        run: |
          echo "deployment_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          NODE_OPTIONS="--max-old-space-size=2048" npm run build -- --mode production

      - name: Deploy built files to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/tmp/elimu-deploy"
          strip_components: 2

      - name: Trigger backend deployment
        run: |
          RESPONSE=$(curl -X POST             -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}"             -w "\n%{http_code}"             https://elimu-smart.co.ke/webhooks/deploy/production)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Deployment trigger failed: HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          echo "✅ Backend deployment triggered"
          echo "$BODY"

      - name: Move built files to production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo cp -r /tmp/elimu-deploy/* /var/www/elimu-smart/
            rm -rf /tmp/elimu-deploy
            echo "✅ Frontend deployed"

      - name: Verify deployment
        id: verify
        continue-on-error: true
        run: |
          echo "⏳ Waiting for Parse Server to restart..."
          sleep 45
          
          # Retry up to 5 times with exponential backoff
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            PROD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://elimu-smart.co.ke/parse/health)
            FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://elimu-smart.co.ke/)
            
            if [ "$PROD_STATUS" = "200" ] && [ "$FRONTEND_STATUS" = "200" ]; then
              echo "✅ Deployment verified - Backend: $PROD_STATUS, Frontend: $FRONTEND_STATUS"
              echo "status=success" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              WAIT_TIME=$((10 * RETRY_COUNT))
              echo "⚠️  Backend: $PROD_STATUS, Frontend: $FRONTEND_STATUS - Retrying in ${WAIT_TIME}s... ($RETRY_COUNT/$MAX_RETRIES)"
              sleep $WAIT_TIME
            fi
          done
          
          echo "❌ Deployment verification failed after $MAX_RETRIES attempts"
          echo "Backend: $PROD_STATUS, Frontend: $FRONTEND_STATUS"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1

      - name: Self-Healing - Automatic Rollback
        if: steps.verify.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔄 Initiating automatic rollback..."
            
            # Restart Parse Server with PM2
            pm2 restart parse-server-prod
            
            # Wait and verify
            sleep 30
            
            # Check if service recovered
            if curl -s -f https://elimu-smart.co.ke/parse/health > /dev/null; then
              echo "✅ Service recovered after restart"
              exit 0
            else
              echo "❌ Service still unhealthy after restart"
              echo "📧 Manual intervention required"
              exit 1
            fi

      - name: Trigger health monitoring
        if: always()
        run: |
          # Trigger immediate health check workflow
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/health-check.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ steps.timestamp.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: ${{ steps.timestamp.outputs.deployment_time }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.verify.outputs.status || 'unknown' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Verification**: ${{ steps.verify.outcome }}" >> $GITHUB_STEP_SUMMARY

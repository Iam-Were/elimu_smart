name: Health Check & Monitoring

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Production Health
        run: |
          PROD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://elimu-smart.co.ke/parse/health)
          if [ "$PROD_STATUS" != "200" ]; then
            echo "❌ Production health check failed: $PROD_STATUS"
            exit 1
          fi
          echo "✅ Production healthy: $PROD_STATUS"

      - name: Check Staging Health
        run: |
          STAGING_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.elimu-smart.co.ke/parse/health)
          if [ "$STAGING_STATUS" != "200" ]; then
            echo "⚠️ Staging health check failed: $STAGING_STATUS"
            # Don't fail the job for staging
          else
            echo "✅ Staging healthy: $STAGING_STATUS"
          fi

      - name: Check VPS Resources
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== VPS Health Status ==="
            echo "Uptime: $(uptime)"
            echo "Memory: $(free -h | grep Mem | awk '{print $3"/"$2}')"
            echo "Disk: $(df -h / | tail -1 | awk '{print $3"/"$2" ("$5" used)"}')"
            echo "PM2 Status:"
            pm2 status

name: Backup Database

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  workflow_dispatch:  # Manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Database Backup Status
        run: |
          echo "ℹ️ Database backups are handled by VPS cron job"
          echo "Location: /root/elimu_smart/backend/scripts/backup-database.sh"
          echo "Schedule: Daily at 2 AM (VPS local time)"
          echo "Retention: 30 days"
          echo ""
          echo "To verify backup status, check VPS logs or run:"
          echo "ssh root@145.239.42.121 'ls -lh ~/elimu_smart_backups/ | tail -10'"

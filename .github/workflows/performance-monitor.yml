name: Performance & Security Monitor

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM
  workflow_dispatch:

jobs:
  performance-check:
    runs-on: ubuntu-latest

    steps:
      - name: Lighthouse Performance Audit
        run: |
          npm install -g @lhci/cli
          lhci autorun --url=https://elimu-smart.co.ke || true

      - name: Security Headers Check
        run: |
          echo "=== Security Headers Check ==="
          curl -I https://elimu-smart.co.ke | grep -i "strict-transport-security\|x-frame-options\|x-content-type-options\|content-security-policy"

      - name: SSL Certificate Check
        run: |
          echo "=== SSL Certificate Expiry ==="
          echo | openssl s_client -servername elimu-smart.co.ke -connect elimu-smart.co.ke:443 2>/dev/null | openssl x509 -noout -dates

      - name: Database Performance Info
        run: |
          echo "ℹ️ Database performance monitoring is handled on VPS"
          echo "To check database stats, run on VPS:"
          echo "PGPASSWORD=password psql -h localhost -U elimu -d elimu_smart_production -c \"SELECT schemaname, tablename, pg_size_pretty(pg_total_relation_size(schemaname||'.'||tablename)) AS size FROM pg_tables WHERE schemaname = 'public' ORDER BY pg_total_relation_size(schemaname||'.'||tablename) DESC LIMIT 10;\""

# Self-Healing CI/CD with GitHub Models (Claude 3.5 Sonnet)
# Auto-fixes TypeScript and ESLint errors using AI

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail workflow, allow auto-fix to run
    outputs:
      build-status: ${{ steps.build.outcome }}

    strategy:
      matrix:
        node-version: [20.x]
        # Match VPS production Node version (20.19.5)

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      id: build
      run: |
        cd frontend
        npm run build 2>&1 | tee ../build-error.log
        exit ${PIPESTATUS[0]}
      continue-on-error: true

    - name: Upload error log
      if: steps.build.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: build-errors
        path: build-error.log

    - name: Install backend
      if: success()
      run: |
        cd backend
        npm ci

  auto-fix:
    needs: build
    if: needs.build.outputs.build-status == 'failure' || contains(needs.build.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      models: write  # Required for GitHub Models API access

    steps:
      - uses: actions/checkout@v4

      - name: Download error log
        uses: actions/download-artifact@v4
        with:
          name: build-errors

      - name: Self-healing with GitHub Models (Claude 3.5 Sonnet)
        id: analyze
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read error log
            const errorLog = fs.readFileSync('build-error.log', 'utf8');
            console.log('📋 Build Error Log:\n', errorLog);

            // Extract file path from error
            const fileMatch = errorLog.match(/src\/([\w\/\-\.]+\.tsx?)/);
            const filePath = fileMatch ? `frontend/src/${fileMatch[1]}` : null;

            let fileContent = '';
            if (filePath && fs.existsSync(filePath)) {
              fileContent = fs.readFileSync(filePath, 'utf8');
              console.log(`📄 Found file: ${filePath}`);
            }

            // Call GitHub Models API with Claude 3.5 Sonnet
            console.log('🤖 Calling Claude 3.5 Sonnet via GitHub Models...');

            const response = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${{ secrets.GITHUB_TOKEN }}`
              },
              body: JSON.stringify({
                model: 'Claude-3.5-Sonnet',
                messages: [
                  {
                    role: 'system',
                    content: 'You are a TypeScript build error fixing agent for React projects. Analyze errors and provide exact code fixes. Return ONLY valid JSON with this structure: {"fixable": true/false, "confidence": 0-100, "fixes": [{"file": "relative/path", "search": "exact old code", "replace": "exact new code", "explanation": "brief reason"}]}'
                  },
                  {
                    role: 'user',
                    content: `**Build Error:**
            \`\`\`
            ${errorLog}
            \`\`\`

            **File Content (${filePath || 'unknown'}):**
            \`\`\`typescript
            ${fileContent.slice(0, 3000)}
            \`\`\`

            **Project Rules:**
            - TypeScript strict mode: no unused variables (TS6133), no 'any' types
            - shadcn UI components use lowercase imports (@/components/ui/button)
            - React hooks: all dependencies must be listed in useEffect/useCallback
            - ESLint: prefer-const, no-unused-vars enforced

            **Auto-Fixable Errors:**
            ✅ Unused variables/imports (TS6133)
            ✅ Missing type annotations (TS7006)
            ✅ Incorrect import casing
            ✅ ESLint violations
            ✅ Missing hook dependencies

            ❌ NOT Fixable (require human review):
            - Logic errors
            - Breaking API changes
            - Security issues

            Analyze and provide fix in JSON format. Only fix if confidence >= 80%.`
                  }
                ],
                temperature: 0.2,
                max_tokens: 2000
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              console.log('❌ API Error:', errorText);
              core.setOutput('fixed', 'false');
              core.setOutput('error', `API call failed: ${response.status}`);
              return;
            }

            const data = await response.json();
            console.log('📥 API Response:', JSON.stringify(data, null, 2));

            // Parse Claude's response
            const analysis = JSON.parse(data.choices[0].message.content);
            console.log('🔍 Analysis:', JSON.stringify(analysis, null, 2));

            // Apply fixes if confidence is high enough
            if (analysis.fixable && analysis.confidence >= 80 && analysis.fixes.length > 0) {
              for (const fix of analysis.fixes) {
                const targetFile = fix.file.startsWith('frontend/') ? fix.file : `frontend/${fix.file}`;

                if (!fs.existsSync(targetFile)) {
                  console.log(`⚠️  File not found: ${targetFile}`);
                  continue;
                }

                let content = fs.readFileSync(targetFile, 'utf8');

                // Apply fix
                if (content.includes(fix.search)) {
                  content = content.replace(fix.search, fix.replace);
                  fs.writeFileSync(targetFile, content);
                  console.log(`✅ Fixed ${targetFile}: ${fix.explanation}`);
                } else {
                  console.log(`⚠️  Search string not found in ${targetFile}`);
                }
              }

              core.setOutput('fixed', 'true');
              core.setOutput('fixes', JSON.stringify(analysis.fixes, null, 2));
              core.setOutput('confidence', analysis.confidence);
            } else {
              console.log(`❌ Not fixable (fixable: ${analysis.fixable}, confidence: ${analysis.confidence}%)`);
              core.setOutput('fixed', 'false');
              core.setOutput('reason', `Confidence too low (${analysis.confidence}%) or not fixable`);
            }

      - name: Commit fixes
        if: steps.analyze.outputs.fixed == 'true'
        run: |
          git config user.name "Self-Healing Bot"
          git config user.email "bot@elimu-smart.co.ke"
          git add .
          git commit -m "🤖 Auto-fix: Resolved build errors (Confidence: ${{ steps.analyze.outputs.confidence }}%)

          Fixes applied by Claude 3.5 Sonnet:
          ${{ steps.analyze.outputs.fixes }}

          🤖 Generated with GitHub Models
          Co-Authored-By: Claude 3.5 Sonnet <models@github.com>"
          git push

      - name: Setup Node.js for retry
        if: steps.analyze.outputs.fixed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Retry build
        if: steps.analyze.outputs.fixed == 'true'
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Notify failure if not fixed
        if: steps.analyze.outputs.fixed == 'false'
        run: |
          echo "❌ Auto-fix failed or not applicable"
          echo "Reason: ${{ steps.analyze.outputs.reason || steps.analyze.outputs.error }}"
          echo "Manual intervention required"
          exit 1

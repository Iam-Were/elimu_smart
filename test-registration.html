<!DOCTYPE html>
<html>
<head>
    <title>Test Registration</title>
</head>
<body>
    <h1>Test Registration API</h1>
    <button onclick="testRegistration()">Test Registration</button>
    <div id="result"></div>

    <script>
        async function testRegistration() {
            const testData = {
                username: "antony.we.test@example.com",
                email: "antony.we.test@example.com", 
                password: "TestPass123!",
                firstName: "Antony",
                lastName: "We",
                role: "student"
            };

            const headers = {
                'X-Parse-Application-Id': 'elimu-smart-local-dev',
                'X-Parse-Javascript-Key': 'elimu-smart-js-key-dev',
                'Content-Type': 'application/json'
            };

            try {
                console.log('Sending registration request...');
                const response = await fetch('http://localhost:1337/parse/users', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(testData)
                });

                console.log('Response status:', response.status);
                const result = await response.json();
                console.log('Response data:', result);
                
                document.getElementById('result').innerHTML = `
                    <h3>Response:</h3>
                    <p>Status: ${response.status}</p>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `
                    <h3>Error:</h3>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>

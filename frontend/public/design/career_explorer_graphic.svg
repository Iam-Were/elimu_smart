<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Career Explorer: Network of career pathways -->
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#faf9f5"/>

  <!-- Title -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#475569" text-anchor="middle">CAREER EXPLORER</text>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Discover 200+ Kenyan Career Profiles & Pathways</text>

  <!-- Career network visualization -->
  <g id="career-network">
    <!-- Central hub -->
    <circle cx="400" cy="300" r="40" fill="url(#amberGrad)"/>
    <text x="400" y="308" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">YOU</text>

    <!-- Career clusters (6 sectors) -->
    <g id="cluster-1">
      <circle cx="300" cy="180" r="30" fill="white" stroke="url(#amberGrad)" stroke-width="3"/>
      <text x="300" y="185" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">Health</text>
      <line x1="400" y1="300" x2="300" y2="180" stroke="url(#amberGrad)" stroke-width="2" opacity="0.3"/>
    </g>

    <g id="cluster-2">
      <circle cx="500" cy="180" r="30" fill="white" stroke="url(#amberGrad)" stroke-width="3"/>
      <text x="500" y="185" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">Tech</text>
      <line x1="400" y1="300" x2="500" y2="180" stroke="url(#amberGrad)" stroke-width="2" opacity="0.3"/>
    </g>

    <g id="cluster-3">
      <circle cx="580" cy="300" r="30" fill="white" stroke="url(#amberGrad)" stroke-width="3"/>
      <text x="580" y="305" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">Business</text>
      <line x1="400" y1="300" x2="580" y2="300" stroke="url(#amberGrad)" stroke-width="2" opacity="0.3"/>
    </g>

    <g id="cluster-4">
      <circle cx="500" cy="420" r="30" fill="white" stroke="url(#amberGrad)" stroke-width="3"/>
      <text x="500" y="425" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">Law</text>
      <line x1="400" y1="300" x2="500" y2="420" stroke="url(#amberGrad)" stroke-width="2" opacity="0.3"/>
    </g>

    <g id="cluster-5">
      <circle cx="300" cy="420" r="30" fill="white" stroke="url(#amberGrad)" stroke-width="3"/>
      <text x="300" y="425" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">Arts</text>
      <line x1="400" y1="300" x2="300" y2="420" stroke="url(#amberGrad)" stroke-width="2" opacity="0.3"/>
    </g>

    <g id="cluster-6">
      <circle cx="220" cy="300" r="30" fill="white" stroke="url(#amberGrad)" stroke-width="3"/>
      <text x="220" y="303" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle">Engineer</text>
      <line x1="400" y1="300" x2="220" y2="300" stroke="url(#amberGrad)" stroke-width="2" opacity="0.3"/>
    </g>

    <!-- Sub-career nodes (smaller) -->
    <circle cx="260" cy="140" r="12" fill="url(#amberGrad)" opacity="0.5"/>
    <circle cx="340" cy="140" r="12" fill="url(#amberGrad)" opacity="0.5"/>
    <circle cx="460" cy="140" r="12" fill="url(#amberGrad)" opacity="0.5"/>
    <circle cx="540" cy="140" r="12" fill="url(#amberGrad)" opacity="0.5"/>
    <circle cx="620" cy="260" r="12" fill="url(#amberGrad)" opacity="0.5"/>
    <circle cx="620" cy="340" r="12" fill="url(#amberGrad)" opacity="0.5"/>
    <circle cx="540" cy="460" r="12" fill="url(#amberGrad)" opacity="0.5"/>
    <circle cx="460" cy="460" r="12" fill="url(#amberGrad)" opacity="0.5"/>
    <circle cx="340" cy="460" r="12" fill="url(#amberGrad)" opacity="0.5"/>
    <circle cx="260" cy="460" r="12" fill="url(#amberGrad)" opacity="0.5"/>
    <circle cx="180" cy="340" r="12" fill="url(#amberGrad)" opacity="0.5"/>
    <circle cx="180" cy="260" r="12" fill="url(#amberGrad)" opacity="0.5"/>
  </g>

  <!-- Metrics -->
  <g id="metrics" transform="translate(60, 530)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#64748b">200+ CAREERS</text>
    <text x="200" y="0" font-family="Arial, sans-serif" font-size="14" fill="#64748b">KENYA-SPECIFIC</text>
    <text x="420" y="0" font-family="Arial, sans-serif" font-size="14" fill="#64748b">REAL SALARY DATA</text>
  </g>
</svg>

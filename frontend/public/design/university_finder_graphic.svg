<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- University Course Finder: Building blocks + pathways -->
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#faf9f5"/>

  <!-- Title -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#475569" text-anchor="middle">UNIVERSITY COURSE FINDER</text>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Match Your KCSE Results to Perfect University Programs</text>

  <!-- University buildings (simplified architecture) -->
  <g id="universities" transform="translate(200, 250)">
    <!-- Building 1 (main) -->
    <rect x="0" y="40" width="80" height="140" fill="white" stroke="url(#indigoGrad)" stroke-width="3"/>
    <rect x="20" y="0" width="40" height="40" fill="url(#indigoGrad)"/>  <!-- Dome/roof -->
    <circle cx="40" cy="20" r="15" fill="white" stroke="url(#indigoGrad)" stroke-width="2"/>

    <!-- Windows -->
    <rect x="15" y="70" width="20" height="25" fill="#e0e7ff"/>
    <rect x="45" y="70" width="20" height="25" fill="#e0e7ff"/>
    <rect x="15" y="110" width="20" height="25" fill="#e0e7ff"/>
    <rect x="45" y="110" width="20" height="25" fill="#e0e7ff"/>

    <!-- Building 2 -->
    <rect x="120" y="80" width="60" height="100" fill="white" stroke="url(#indigoGrad)" stroke-width="2"/>
    <rect x="130" y="100" width="15" height="20" fill="#e0e7ff"/>
    <rect x="155" y="100" width="15" height="20" fill="#e0e7ff"/>
    <rect x="130" y="140" width="15" height="20" fill="#e0e7ff"/>
    <rect x="155" y="140" width="15" height="20" fill="#e0e7ff"/>

    <!-- Building 3 -->
    <rect x="220" y="100" width="60" height="80" fill="white" stroke="url(#indigoGrad)" stroke-width="2"/>
    <rect x="230" y="120" width="15" height="20" fill="#e0e7ff"/>
    <rect x="255" y="120" width="15" height="20" fill="#e0e7ff"/>
    <rect x="230" y="150" width="15" height="20" fill="#e0e7ff"/>
  </g>

  <!-- Pathways (student journey to uni) -->
  <g id="pathways">
    <path d="M 100 450 Q 250 380 400 350" fill="none" stroke="url(#indigoGrad)" stroke-width="3" stroke-dasharray="8,5" opacity="0.5"/>
    <path d="M 700 450 Q 550 380 400 350" fill="none" stroke="url(#indigoGrad)" stroke-width="3" stroke-dasharray="8,5" opacity="0.5"/>
  </g>

  <!-- Icon elements -->
  <g id="student-icon" transform="translate(100, 420)">
    <circle cx="0" cy="0" r="18" fill="white" stroke="url(#indigoGrad)" stroke-width="2"/>
    <circle cx="0" cy="-5" r="6" fill="url(#indigoGrad)"/>
    <path d="M -8,8 L 8,8" stroke="url(#indigoGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="student-icon-2" transform="translate(700, 420)">
    <circle cx="0" cy="0" r="18" fill="white" stroke="url(#indigoGrad)" stroke-width="2"/>
    <circle cx="0" cy="-5" r="6" fill="url(#indigoGrad)"/>
    <path d="M -8,8 L 8,8" stroke="url(#indigoGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Central matching icon -->
  <g id="match-icon" transform="translate(400, 330)">
    <circle cx="0" cy="0" r="25" fill="url(#indigoGrad)"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">✓</text>
  </g>

  <!-- Metrics -->
  <g id="metrics" transform="translate(60, 530)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#64748b">45+ UNIVERSITIES</text>
    <text x="220" y="0" font-family="Arial, sans-serif" font-size="14" fill="#64748b">KUCCPS INTEGRATED</text>
    <text x="480" y="0" font-family="Arial, sans-serif" font-size="14" fill="#64748b">INSTANT MATCHING</text>
  </g>
</svg>

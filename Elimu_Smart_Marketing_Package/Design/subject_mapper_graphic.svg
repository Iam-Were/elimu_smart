<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Subject-Career Mapper: KCSE subjects flowing to careers -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#faf9f5"/>

  <!-- Title -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#475569" text-anchor="middle">SUBJECT-CAREER MAPPER</text>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">See Which Careers Match Your KCSE Subject Combination</text>

  <!-- Flow diagram: Subjects → Careers -->
  <g id="subject-flow">
    <!-- Left side: KCSE Subjects -->
    <g id="subjects">
      <rect x="80" y="160" width="140" height="35" fill="white" stroke="url(#blueGrad)" stroke-width="2" rx="5"/>
      <text x="150" y="183" font-family="Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">Mathematics</text>

      <rect x="80" y="215" width="140" height="35" fill="white" stroke="url(#blueGrad)" stroke-width="2" rx="5"/>
      <text x="150" y="238" font-family="Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">Physics</text>

      <rect x="80" y="270" width="140" height="35" fill="white" stroke="url(#blueGrad)" stroke-width="2" rx="5"/>
      <text x="150" y="293" font-family="Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">Chemistry</text>

      <rect x="80" y="325" width="140" height="35" fill="white" stroke="url(#blueGrad)" stroke-width="2" rx="5"/>
      <text x="150" y="348" font-family="Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">Biology</text>

      <rect x="80" y="380" width="140" height="35" fill="white" stroke="url(#blueGrad)" stroke-width="2" rx="5"/>
      <text x="150" y="403" font-family="Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">Computer</text>
    </g>

    <!-- Right side: Career outcomes -->
    <g id="careers">
      <rect x="580" y="180" width="140" height="35" fill="url(#blueGrad)" rx="5"/>
      <text x="650" y="203" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Engineer</text>

      <rect x="580" y="250" width="140" height="35" fill="url(#blueGrad)" rx="5"/>
      <text x="650" y="273" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Doctor</text>

      <rect x="580" y="320" width="140" height="35" fill="url(#blueGrad)" rx="5"/>
      <text x="650" y="343" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">IT Professional</text>

      <rect x="580" y="390" width="140" height="35" fill="url(#blueGrad)" rx="5"/>
      <text x="650" y="413" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Researcher</text>
    </g>

    <!-- Connection flows (Sankey diagram style) -->
    <path d="M 220 177 Q 400 177 580 197" fill="none" stroke="url(#blueGrad)" stroke-width="2" opacity="0.3"/>
    <path d="M 220 232 Q 400 232 580 197" fill="none" stroke="url(#blueGrad)" stroke-width="2" opacity="0.3"/>
    <path d="M 220 287 Q 400 287 580 267" fill="none" stroke="url(#blueGrad)" stroke-width="2" opacity="0.3"/>
    <path d="M 220 342 Q 400 342 580 267" fill="none" stroke="url(#blueGrad)" stroke-width="2" opacity="0.3"/>
    <path d="M 220 397 Q 400 397 580 337" fill="none" stroke="url(#blueGrad)" stroke-width="2" opacity="0.3"/>
    <path d="M 220 232 Q 400 267 580 337" fill="none" stroke="url(#blueGrad)" stroke-width="1" opacity="0.2"/>
    <path d="M 220 287 Q 400 337 580 407" fill="none" stroke="url(#blueGrad)" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Central matching algorithm icon -->
  <g id="algorithm" transform="translate(400, 300)">
    <circle cx="0" cy="0" r="35" fill="white" stroke="url(#blueGrad)" stroke-width="3"/>
    <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="url(#blueGrad)" stroke-width="2" rx="3"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="url(#blueGrad)" stroke-width="2"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="url(#blueGrad)" stroke-width="2"/>
  </g>

  <!-- Metrics -->
  <g id="metrics" transform="translate(60, 530)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#64748b">8 SUBJECTS</text>
    <text x="180" y="0" font-family="Arial, sans-serif" font-size="14" fill="#64748b">100+ COMBINATIONS</text>
    <text x="420" y="0" font-family="Arial, sans-serif" font-size="14" fill="#64748b">INSTANT MATCHING</text>
  </g>
</svg>

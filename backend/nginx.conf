# Elimu Smart Nginx Configuration
# For TrueHosts VPS deployment

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=parse_limit:10m rate=200r/m;

# Frontend (yourdomain.com)
server {
    listen 80;
    listen [::]:80;
    server_name elimu-smart.co.ke www.elimu-smart.co.ke;

    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elimu-smart.co.ke www.elimu-smart.co.ke;

    # SSL certificates (configured by certbot)
    ssl_certificate /etc/letsencrypt/live/elimu-smart.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elimu-smart.co.ke/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;

    # Serve React frontend (static files)
    root /var/www/elimu-smart;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    # Frontend static files
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Parse Server API
    location /parse {
        proxy_pass http://localhost:1337/parse;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Rate limiting
        limit_req zone=parse_limit burst=20 nodelay;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable caching for Parse API
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # M-Pesa callback endpoints (no auth required)
    location /api/mpesa-callback.php {
        proxy_pass http://localhost:1337/parse/mpesa-callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Allow Safaricom IPs only (optional - add Safaricom IP ranges)
        # allow 196.201.214.0/24;
        # deny all;
    }
}

# Parse Dashboard (dashboard.elimu-smart.co.ke)
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.elimu-smart.co.ke;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.elimu-smart.co.ke;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/elimu-smart.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elimu-smart.co.ke/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Basic auth for additional security (optional)
    # auth_basic "Elimu Smart Admin";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://localhost:4040;  # Parse Dashboard default port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Rate limiting
        limit_req zone=api_limit burst=10 nodelay;
    }
}

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
